# Frontend quality gate — audit AUDIT-AGENTIC-2026-06-10.md task 0.3 (F3).
# Every gate here is also runnable locally: npm run typecheck && npm run lint
# && npx vitest run && npm audit --omit=dev --audit-level=high && npm run build.
#
# Bundle budget: largest JS chunk must gzip under 500 kB (current main chunk is
# the whole app — audit F5). Ratchet DOWN after route-level code splitting
# (audit task 2.1); do not raise it without a deliberate decision.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# PUBLIC client config (the anon key ships in every browser bundle by design —
# this is not a secret; service-role/Stripe-secret keys must NEVER appear here).
# Required because .env is gitignored: without these, `vite build` produces a
# backend-less bundle (every e2e network flow times out) and
# tests/search-preview.test.tsx throws 'supabaseUrl is required' — the root
# cause of CI being red from runs 027fe6a..f7c6e24 (2026-06-10/11).
env:
  VITE_SUPABASE_URL: https://inlagtgpynemhipnqvty.supabase.co
  VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlubGFndGdweW5lbWhpcG5xdnR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2NTUyMDUsImV4cCI6MjA4OTIzMTIwNX0.1V7Th0L9YgfUPdc0ic6FN08qOLXq8tllhH9tCaOoXwE

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (clean, lockfile-exact)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (errors fail; warnings are the ratchet backlog)
        run: npm run lint

      - name: Tests
        run: npx vitest run

      # Fails on any high/critical advisory EXCEPT the documented allowlist —
      # each entry needs a reason and a removal condition. Plain
      # `npm audit --audit-level=high` has no exception mechanism.
      - name: Audit production dependencies (high+, allowlisted exceptions)
        run: |
          node --input-type=module -e "
          import { execSync } from 'node:child_process';
          const ALLOW = new Set([
            // react-router RSC-mode CSRF — RSC/server-actions only; this app is
            // a client SPA (createBrowserRouter), the code path is unreachable.
            // Fixed upstream only in react-router 8. REMOVE on the v8 upgrade.
            'GHSA-qwww-vcr4-c8h2',
          ]);
          let out;
          try { out = execSync('npm audit --omit=dev --json', { maxBuffer: 64 * 1024 * 1024 }).toString(); }
          catch (e) { out = e.stdout.toString(); }
          const audit = JSON.parse(out);
          const bad = [];
          for (const [name, v] of Object.entries(audit.vulnerabilities ?? {})) {
            if (!['high', 'critical'].includes(v.severity)) continue;
            // via objects are this package's own advisories; via strings are
            // transitive pointers to packages that get their own entry.
            const ids = (v.via ?? [])
              .filter((x) => typeof x === 'object')
              .map((x) => (x.url ?? '').split('/').pop());
            const unallowed = ids.filter((id) => !ALLOW.has(id));
            if (unallowed.length) bad.push(name + ': ' + unallowed.join(', '));
          }
          if (bad.length) {
            console.error('FAIL: high+ advisories outside the allowlist:\n' + bad.join('\n'));
            process.exit(1);
          }
          console.log('OK: no high+ advisories outside the allowlist');
          "

      - name: Build
        run: npm run build

      - name: Bundle budget - largest JS chunk < 500 kB gzip
        run: |
          node --input-type=module -e "
          import { readdirSync, readFileSync } from 'node:fs';
          import { gzipSync } from 'node:zlib';
          const dir = 'dist/assets';
          let worst = { file: null, gz: 0 };
          for (const f of readdirSync(dir).filter((f) => f.endsWith('.js'))) {
            const gz = gzipSync(readFileSync(dir + '/' + f)).length;
            console.log(f.padEnd(40), (gz / 1024).toFixed(1) + ' kB gzip');
            if (gz > worst.gz) worst = { file: f, gz };
          }
          const LIMIT = 500 * 1024;
          if (worst.gz > LIMIT) {
            console.error('FAIL: ' + worst.file + ' is ' + (worst.gz / 1024).toFixed(1) + ' kB gzip (limit 500 kB)');
            process.exit(1);
          }
          console.log('OK: largest chunk ' + (worst.gz / 1024).toFixed(1) + ' kB gzip <= 500 kB');
          "

  # E2E (audit task 2.2, F16): hermetic run against the locally-built bundle
  # (playwright.config.ts starts vite preview when BASE_URL is unset). The
  # anonymous flows always run; role-gated flows skip until E2E_* secrets are
  # configured. Preview-deployment runs live in e2e-preview.yml.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite (local preview server)
        run: npx playwright test
        env:
          E2E_SEEKER_EMAIL: ${{ secrets.E2E_SEEKER_EMAIL }}
          E2E_SEEKER_PASSWORD: ${{ secrets.E2E_SEEKER_PASSWORD }}
          E2E_EMPLOYER_EMAIL: ${{ secrets.E2E_EMPLOYER_EMAIL }}
          E2E_EMPLOYER_PASSWORD: ${{ secrets.E2E_EMPLOYER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
